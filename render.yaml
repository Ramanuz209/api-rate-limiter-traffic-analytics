services:
  # Web Service hosting unified Node.js API + React frontend
  - type: web
    name: rateflow-api-platform
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_DIALECT
        value: sqlite # Default zero-config fallback if PostgreSQL is not provisioned
      # If using Render Postgres:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: rateflow-postgres
      #     property: connectionString
      # If using Upstash or Redis:
      # - key: REDIS_URL
      #   sync: false

# Optional Render PostgreSQL Database (uncomment if using Render's PostgreSQL service)
# databases:
#   - name: rateflow-postgres
#     plan: free
